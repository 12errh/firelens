services:
  - type: web
    name: flame-in-freefall-api
    runtime: python
    plan: free
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: ALLOWED_ORIGINS
        sync: false
      - key: RAG_API_URL
        sync: false
      - key: RAG_API_KEY
        sync: false
